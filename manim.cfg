# Configuração do Manim Community para este projeto.
#
# Precedência (o de baixo vence):
#   1. defaults da biblioteca
#   2. ~/.config/manim/manim.cfg   (global do usuário)
#   3. ESTE arquivo               (pasta do projeto)
#   4. flags da CLI
#   5. config.<chave> = ... no Python / tempconfig(...)
#
# Regra de cor (verificada na 0.21.0): o que importa é o prefixo `#`,
# não a quantidade de dígitos.
#   background_color = #FF0000   OK
#   background_color = #F00      OK — expande para #FF0000
#   background_color = FF0000    QUEBRA — sem `#` é lido como NOME de cor
#
# Veja todas as chaves com:  .venv/bin/manim cfg show

[CLI]

# --- saída ---------------------------------------------------------------
media_dir = ./media
video_dir = {media_dir}/videos/{module_name}/{quality}
images_dir = {media_dir}/images/{module_name}
tex_dir = {media_dir}/Tex
text_dir = {media_dir}/texts
partial_movie_dir = {video_dir}/partial_movie_files/{scene_name}
log_dir = {media_dir}/logs

# --- qualidade padrão ----------------------------------------------------
# Padrão alto para entrega. Sobrescreva com -ql enquanto itera.
quality = high_quality
frame_rate = 60
pixel_width = 1920
pixel_height = 1080

# --- renderer ------------------------------------------------------------
# cairo  = CPU, estável, é o que a maior parte da documentação assume.
# opengl = ModernGL/GPU. Neste notebook híbrido exige PRIME offload:
#          use bin/manim ou bin/mx, que exportam as variáveis certas.
renderer = cairo

# --- encoding ------------------------------------------------------------
movie_file_extension = .mp4

# ManimCE >= 0.20: codifica N partial movies em paralelo enquanto a cena
# continua renderizando. Esta máquina tem 32 threads, então 4 é conservador
# e seguro. Ganho maior em cenas com muitas animações curtas.
max_inflight_encoders = 4
encoder_queue_size = 8

# O codec é fixo em libx264 no código do ManimCE (ele usa PyAV, não o CLI
# do ffmpeg). Para NVENC use a camada manimx:
#   mx render cena.py Cena --codec nvenc
#   from manimx import enable_nvenc; enable_nvenc()

# --- aparência -----------------------------------------------------------
background_color = BLACK
background_opacity = 1

# --- cache ---------------------------------------------------------------
# O Manim reaproveita partial movies por hash da animação. Se a cena lê
# dados externos (CSV, API, arquivo), o hash não enxerga isso — passe
# --disable_caching nesses casos.
max_files_cached = 200
flush_cache = False
disable_caching = False

# --- desenvolvimento -----------------------------------------------------
verbosity = INFO
progress_bar = display
notify_outdated_version = False
preview = False
